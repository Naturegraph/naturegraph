<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/hermine-icon.png" />
    <link rel="apple-touch-icon" href="/hermine-icon.png" />

    <!-- PWA manifest (BATCH 36) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport (BATCH 115 : viewport-fit=cover pour notch iPhone X+ / safe areas) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Compat navigateurs (BATCH 115) -->
    <meta name="color-scheme" content="light" />
    <!-- mobile-web-app-capable est la nouvelle clé standard. apple-mobile-web-app-capable
         reste pour iOS Safari uniquement (deprecated dans Chrome 116+ mais necessaire pour iOS). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO principal -->
    <title>Naturegraph — Explorez et partagez la biodiversité</title>
    <meta name="description" content="Naturegraph est l'application nature pour documenter tes sorties, partager tes observations et connecter avec une communauté de passionnés de biodiversité." />
    <meta name="keywords" content="nature, biodiversité, observations, faune, flore, communauté, application nature, naturaliste" />
    <meta name="author" content="Naturegraph" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://naturegraph.ca/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Naturegraph" />
    <meta property="og:url" content="https://naturegraph.ca/" />
    <meta property="og:title" content="Naturegraph — Explorez et partagez la biodiversité" />
    <meta property="og:description" content="Documente tes sorties nature, partage tes observations et rejoins une communauté de passionnés de biodiversité." />
    <meta property="og:image" content="https://naturegraph.ca/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_CA" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@naturegraph" />
    <meta name="twitter:title" content="Naturegraph — Explorez et partagez la biodiversité" />
    <meta name="twitter:description" content="Documente tes sorties nature, partage tes observations et rejoins une communauté de passionnés de biodiversité." />
    <meta name="twitter:image" content="https://naturegraph.ca/og-preview.png" />

    <!-- Thème navigateur (barre d'adresse mobile) -->
    <meta name="theme-color" content="#006666" />

    <!--
      Content Security Policy
      ════════════════════════════════════════════════════════════════════
      Source unique : `vercel.json` (HTTP headers) — BATCH 39 unification.

      X-Frame-Options RETIRE de meta (2026-05-31) : la spec interdit cette
      directive en meta, elle DOIT etre un HTTP header. Voir vercel.json qui
      la pose proprement. La directive frame-ancestors de la CSP HTTP couvre
      le meme cas (anti-clickjacking) pour les navigateurs modernes.
      ════════════════════════════════════════════════════════════════════
    -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // MVP : thème forcé en light — dark mode post-MVP
      document.documentElement.setAttribute('data-theme', 'light');
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
