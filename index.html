<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/hermine-icon.png" />
    <link rel="apple-touch-icon" href="/hermine-icon.png" />

    <!-- PWA manifest (BATCH 36) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport (BATCH 115 : viewport-fit=cover pour notch iPhone X+ / safe areas) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Compat navigateurs (BATCH 115) -->
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO principal -->
    <title>Naturegraph — Explorez et partagez la biodiversité</title>
    <meta name="description" content="Naturegraph est l'application nature pour documenter tes sorties, partager tes observations et connecter avec une communauté de passionnés de biodiversité." />
    <meta name="keywords" content="nature, biodiversité, observations, faune, flore, communauté, application nature, naturaliste" />
    <meta name="author" content="Naturegraph" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://naturegraph.fr/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Naturegraph" />
    <meta property="og:url" content="https://naturegraph.fr/" />
    <meta property="og:title" content="Naturegraph — Explorez et partagez la biodiversité" />
    <meta property="og:description" content="Documente tes sorties nature, partage tes observations et rejoins une communauté de passionnés de biodiversité." />
    <meta property="og:image" content="https://naturegraph.fr/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@naturegraph" />
    <meta name="twitter:title" content="Naturegraph — Explorez et partagez la biodiversité" />
    <meta name="twitter:description" content="Documente tes sorties nature, partage tes observations et rejoins une communauté de passionnés de biodiversité." />
    <meta name="twitter:image" content="https://naturegraph.fr/og-preview.png" />

    <!-- Thème navigateur (barre d'adresse mobile) -->
    <meta name="theme-color" content="#006666" />

    <!--
      Content Security Policy
      ════════════════════════════════════════════════════════════════════
      Source unique : `vercel.json` (HTTP headers) — BATCH 39 unification.

      Pourquoi pas de meta CSP ici :
        • Les HTTP headers ont la priorite et couvrent les meme cas
        • Avoir 2 CSP cree une intersection des permissions = la plus stricte
          gagne. Cela bloquait Sentry et TAXREF en prod (CSP meta n'autorise pas
          *.sentry.io ni api.taxref.fr alors que vercel.json oui).
        • En local dev, Vite serve sans CSP (les connect-src localhost sont OK
          car aucune restriction CSP appliquee en dev).

      Conserve X-Frame-Options DENY ici comme fallback pour navigateurs anciens
      qui ne lisent pas la directive frame-ancestors de CSP.
      ════════════════════════════════════════════════════════════════════
    -->

    <!-- Anti-clickjacking (support navigateurs anciens ne lisant pas CSP frame-ancestors) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // MVP : thème forcé en light — dark mode post-MVP
      document.documentElement.setAttribute('data-theme', 'light');
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
