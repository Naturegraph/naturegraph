<!doctype html>

    <link rel="apple-touch-icon" href="/hermine-icon.png" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO principal -->
    <title>Naturegraph — Explorez et partagez la biodiversité</title>
    <meta name="description" content="Naturegraph est l'application nature pour documenter tes sorties, partager tes observations et connecter avec une communauté de passionnés de biodiversité." />

    <link rel="canonical" href="https://naturegraph.fr/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Naturegraph" />
    <meta property="og:url" content="https://naturegraph.fr/" />
    <meta property="og:title" content="Naturegraph — Explorez et partagez la biodiversité" />
    <meta property="og:description" content="Documente tes sorties nature, partage tes observations et rejoins une communauté de passionnés de biodiversité." />
    <meta property="og:image" content="https://naturegraph.fr/og-preview.png" />
    <meta property="og:image:width" content="1200" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@naturegraph" />
    <meta name="twitter:title" content="Naturegraph — Explorez et partagez la biodiversité" />
    <meta name="twitter:description" content="Documente tes sorties nature, partage tes observations et rejoins une communauté de passionnés de biodiversité." />
    <meta name="twitter:image" content="https://naturegraph.fr/og-preview.png" />

    <!-- Thème navigateur (barre d'adresse mobile) -->
    <meta name="theme-color" content="#006666" />

    <!--
      Content Security Policy
      ════════════════════════════════════════════════════════════════════
      Protège contre les attaques XSS, clickjacking et injection de ressources.

      Politique :
        • default-src 'self'         → Toutes ressources viennent du même domaine
        • script-src 'self' 'unsafe-inline' → 'unsafe-inline' requis pour le script
                                        d'init thème dans le body (FOUC prevention).
                                        TODO [PROD] : migrer vers un nonce CSP pour
                                        supprimer 'unsafe-inline'.
        • style-src 'self' 'unsafe-inline' fonts.googleapis.com → Tailwind + inline styles
        • font-src fonts.gstatic.com  → Google Fonts
        • img-src 'self' data: blob: https: → Photos utilisateurs (Supabase storage) +
                                        blob URLs (prévisualisation upload)
        • connect-src → Supabase (API + Realtime), Nominatim OSM (geocoding),
                        localhost en développement
        • frame-ancestors 'none'      → Prévention clickjacking (équivalent X-Frame-Options)
        • object-src 'none'           → Désactiver plugins Flash/Java (CVE potentiels)
        • base-uri 'self'             → Empêcher l'injection de <base href="...">

      IMPORTANT : En production, ces headers doivent aussi être envoyés par le serveur
      HTTP (Vercel/Nginx/Cloudflare) pour une protection complète — les meta CSP ne
      s'appliquent pas aux ressources chargées avant le HTML (ex. Service Workers).
      ════════════════════════════════════════════════════════════════════
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      connect-src 'self'
        https://*.supabase.co
        wss://*.supabase.co
        https://nominatim.openstreetmap.org
        http://localhost:*
        ws://localhost:*;
      frame-ancestors 'none';
      object-src 'none';
      base-uri 'self';
    " />

    <!-- Anti-clickjacking (support navigateurs anciens ne lisant pas CSP frame-ancestors) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>

  </body>
