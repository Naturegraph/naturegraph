version: 2

updates:
  # npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Grouper les minor/patch des deps prod et dev pour limiter le bruit
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # V1.0.4 : ignorer les bumps MAJORS pendant la phase beta.
    # Trop de risque de casser le build pour un gain marginal.
    # On les reviewra ponctuellement en V1.1.0 ou plus tard.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "github_actions"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
