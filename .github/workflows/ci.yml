name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # BATCH 23 / T-008 : coverage report (informatif uniquement, fail desactive).
      # Cible 30% activable plus tard via thresholds dans vitest.config.ts.
      - name: Coverage report
        run: npm run test:coverage || true
        continue-on-error: true

      # BATCH 13 / T-003 : detection drift entre src/types/supabase.ts et le
      # schema DB courant. Best-effort (skip si supabase CLI non authentifie
      # — typique en CI sans secrets). Le script exit 2 = skip silencieux,
      # exit 1 = fail (drift detecte).
      - name: Supabase types drift check
        run: npm run check:types-drift || true
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Bundle size check (eco-conception)
        run: |
          JS_SIZE=$(find dist/assets -name '*.js' -exec gzip -c {} + | wc -c)
          JS_KB=$((JS_SIZE / 1024))
          echo "JS gzip total: ${JS_KB}KB"
          # Budget MVP : 330 KB gzip (somme de TOUS les chunks JS, pas la critical
          # path). Note : le first-paint réel pour la home charge ~190 KB gzip
          # (index + vendor + supabase + i18n) — le reste est lazy-loaded par
          # route (Auth, Profile, Contribute, Settings, Notifications).
          # Bumped 300→320 le 2026-05-01 suite à l'ajout de :
          #   - autocomplete localisation API Adresse + popover privacy (~3 KB)
          #   - services saved/follow/block/hidden/report + hooks RQ (~5 KB)
          #   - SharePopover modal Figma (~3 KB)
          #   - règle confidentialité localisation feed
          # Bumped 320→325 le 2026-05-03 suite à RC-D Privacy by Design (PR #49) :
          #   - Cookie Banner + dataExport service + useDataExport hook
          #   - DeleteAccountModal réécrit (matching strict username)
          #   - Privacy.tsx (11 sections) + Legal.tsx (6 sections)
          #   - +~50 clés i18n FR/EN (legal.privacy.* legal.terms.* cookies.* rgpd.*)
          # Bumped 325→330 le 2026-05-13 suite a BATCH 5 + BATCH 6 :
          #   - 3 primitives <EmptyState> <ErrorState> <LoadingState> (~1 KB gzip)
          #   - adoption progressive (NotificationsPage, NotificationsPanel, FeedSection)
          # Bumped 330→420 le 2026-05-14 suite a BATCH 28-35 (Beta + Admin MVP) :
          #   - Front beta : BetaKeyGate + Waitlist + betaService (~5 KB gzip)
          #   - Admin section complete : 6 pages lazy-loaded (~17 KB gzip somme)
          #     • AdminLayout + AdminGuard + useIsAdmin (~3 KB)
          #     • Dashboard + Beta + Audit (~7 KB)
          #     • Users + Moderation (~9 KB — pagination + filters + actions)
          # Le first-paint reel reste ~200 KB gzip (index + vendor + supabase + i18n)
          # car TOUT le code admin/beta est split en chunks separes (lazy-loaded).
          # Bumped 420->480 le 2026-05-25 (Nicolas) suite a :
          #   - SettingsHidden + SettingsBlocked + useBlocks hook
          #   - Image transforms helper + OptimizedImage component
          #   - authGuard recovery global pour sessions mortes (Flo.d case)
          #   - Section Blocages dans SettingsPanel + sous-vues dediees
          # Si on depasse 480, audit les chunks vendor d'abord, bump en dernier recours.
          if [ "$JS_KB" -gt 480 ]; then
            echo "::error::JS bundle exceeds 480KB gzip budget (${JS_KB}KB)"
            exit 1
          fi
          echo "✓ Bundle within eco-conception budget (${JS_KB}/480 KB)"
