name: CodeQL (SAST)

# T-095 / BATCH 17 : Static Application Security Testing via GitHub CodeQL.
# Analyse JavaScript/TypeScript pour detecter vulnerabilites courantes (SQLi
# faux positives, XSS, prototype pollution, secrets en clair, etc.).
#
# Run :
# - hebdo (lundi 09:00 UTC)
# - sur push vers main / staging / develop (apres merge des PRs)
# - sur PR vers main / staging / develop (verif avant merge)

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended : queries supplementaires au-dela du set par defaut
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
